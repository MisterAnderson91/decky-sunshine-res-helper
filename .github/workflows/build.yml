name: Build AppImage

on:
  push:
    branches: [ "**" ] # Triggers on all branches
    paths-ignore:
      - 'LICENSE'
      - 'README.md'
      - 'readme.md'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set CalVer Version
      run: |
        CALVER=$(date +'%Y.%m.%d')
        echo "VERSION=$CALVER" >> $GITHUB_ENV
        echo "Building version: $CALVER"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y file fuse

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt6 pyinstaller

    - name: Inject Version into Python App
      run: |
        sed -i "s/self.current_app_version = \"DEV\"/self.current_app_version = \"${{ env.VERSION }}\"/" installer_app.py

    - name: Build executable with PyInstaller
      run: |
        pyinstaller --noconfirm --noconsole --onedir "installer_app.py"

    - name: Prepare AppDir structure
      run: |
        mkdir -p AppDir/usr/bin
        cp -r dist/installer_app/* AppDir/usr/bin/
        cp install.sh AppDir/usr/bin/
        cp uninstall.sh AppDir/usr/bin/
        cp -r src AppDir/usr/bin/
        
        cat > AppDir/AppRun << 'EOF'
        #!/bin/sh
        HERE="$(dirname "$(readlink -f "${0}")")"
        export LD_LIBRARY_PATH="${HERE}/usr/bin:${LD_LIBRARY_PATH}"
        exec "${HERE}/usr/bin/installer_app" "$@"
        EOF
        chmod +x AppDir/AppRun
        
        cat > AppDir/installer_app.desktop << EOF
        [Desktop Entry]
        Type=Application
        Name=Decky Sunshine Res-Helper
        Exec=installer_app
        Icon=installer_app
        Categories=Utility;
        EOF
        
        echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAACklEQVR4nGMAAQAABQABDQottAAAAABJRU5ErkJggg==" | base64 -d > AppDir/installer_app.png

    - name: Download and execute appimagetool
      run: |
        wget https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-${{ matrix.arch }}.AppImage
        chmod +x appimagetool-${{ matrix.arch }}.AppImage
        VERSION=${{ env.VERSION }} ./appimagetool-${{ matrix.arch }}.AppImage --appimage-extract-and-run AppDir Decky_Sunshine_Res-Helper-${{ env.VERSION }}-${{ matrix.arch }}.AppImage

    # 1. ALWAYS upload the artifact, regardless of branch.
    # Appends the branch name so you know exactly what you are downloading.
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Decky-Sunshine-Res-Helper-${{ env.VERSION }}-${{ matrix.arch }}-${{ github.ref_name }}
        path: "Decky_Sunshine_Res-Helper-${{ env.VERSION }}-${{ matrix.arch }}.AppImage"

    # 2. ONLY run this step if the commit was pushed to the main or master branch.
    - name: Create GitHub Release
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.VERSION }}
        name: Decky Sunshine Res-Helper ${{ env.VERSION }}
        files: Decky_Sunshine_Res-Helper-${{ env.VERSION }}-${{ matrix.arch }}.AppImage
        draft: false
        prerelease: false
